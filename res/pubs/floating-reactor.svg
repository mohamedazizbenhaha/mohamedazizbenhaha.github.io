<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2890c8" stop-opacity=".3"/><stop offset="1" stop-color="#2890c8" stop-opacity=".06"/></linearGradient>
    <radialGradient id="g" cx="40%" cy="40%" r="55%"><stop offset="0" stop-color="#d4a024" stop-opacity=".22"/><stop offset="1" stop-color="#d4a024" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#8fd3ff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="800" height="450" fill="#0a0d12"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <!-- water -->
  <rect y="205" width="800" height="245" fill="url(#w)"/>
  <path d="M0 205C60 199 120 211 180 205S300 199 360 205S480 211 540 205S660 199 800 205" fill="none" stroke="#8fd3ff" stroke-width="2.5"/>
  <!-- chimney (cathode air tube) -->
  <g fill="none" stroke="#f2c45a" stroke-width="3" stroke-linejoin="round">
    <path d="M250 196V62M286 196V62"/>
    <path d="M232 196H304V214H232Z"/>
    <!-- housing and perforated anode tube -->
    <path d="M226 214V240L240 256V300M310 214V240L296 256V300"/>
  </g>
  <g stroke="#f2c45a" stroke-width="5" stroke-linecap="round">
    <path d="M240 312V326M240 340V354M240 368V382M240 396V410M296 312V326M296 340V354M296 368V382M296 396V410"/>
  </g>
  <!-- anode (carbon) -->
  <rect x="264" y="262" width="8" height="90" fill="#e9e3d6"/>
  <!-- biofilm glow on the anode -->
  <g fill="#f2c45a"><circle cx="260" cy="280" r="3"/><circle cx="276" cy="296" r="3"/><circle cx="259" cy="316" r="3"/><circle cx="277" cy="334" r="3"/><circle cx="260" cy="346" r="3"/></g>
  <!-- floating box with the electronics -->
  <g fill="none" stroke="#f2c45a" stroke-width="3" stroke-linejoin="round">
    <path d="M310 206H340V172H660V230H340V214"/>
    <path d="M330 162H670"/>
  </g>
  <rect x="380" y="162" width="250" height="6" fill="#2b4f8a"/>
  <!-- ESP32 board inside the box -->
  <rect x="420" y="184" width="70" height="30" rx="4" fill="#17171f" stroke="#d4a024" stroke-width="2"/>
  <rect x="440" y="191" width="30" height="16" fill="#d4a024" fill-opacity=".6"/>
  <!-- probes hanging under the box -->
  <g stroke="#9d978a" stroke-width="3"><path d="M540 230V330M575 230V300M610 230V345"/></g>
  <g fill="#8fd3ff"><rect x="534" y="330" width="12" height="26" rx="5"/><rect x="569" y="300" width="12" height="26" rx="5"/><rect x="604" y="345" width="12" height="26" rx="5"/></g>
  <!-- radio waves -->
  <g fill="none" stroke="#f2c45a" stroke-linecap="round" stroke-width="3">
    <path d="M640 162V120"/><circle cx="640" cy="116" r="4" fill="#f2c45a"/>
    <path d="M622 98A26 26 0 0 1 658 98" stroke-opacity=".7"/><path d="M608 84A46 46 0 0 1 672 84" stroke-opacity=".45"/>
  </g>
</svg>
